</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Forms Lab</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="task0.html">Task 0</a></li>
        <li class="nav-item"><a class="nav-link active" href="task1.html" aria-current="page">Task 1</a></li>
        <li class="nav-item"><a class="nav-link" href="task2.html">Task 2</a></li>

      </ul>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <h1 class="h3 mb-3">Task 1. Form with HTML5 validation</h1>
    <p class="text-muted">Try submitting an empty form, then an email without “@”, then a message that is too short.</p>
    <form action="#" method="post">
      <div class="form-block">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required minlength="2" maxlength="50"
               pattern="[\p{L} ]+" title="Letters and spaces only">
      </div>
      <div class="form-block">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required maxlength="100">
      </div>
      <div class="form-block">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required minlength="10" maxlength="500"></textarea>
      </div>
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
