<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Forms Lab</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="task0.html">Task 0</a></li>
        <li class="nav-item"><a class="nav-link" href="task1.html">Task 1</a></li>
        <li class="nav-item"><a class="nav-link active" href="task2.html" aria-current="page">Task 2</a></li>
        <li class="nav-item"><a class="nav-link" href="task3.html">Task 3</a></li>
        <li class="nav-item"><a class="nav-link" href="task4.html">Task 4</a></li>
      </ul>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <h1 class="h3 mb-3">Task 2. Bootstrap contact form</h1>
    <form action="#" method="post">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" name="name" placeholder="John Smith" aria-describedby="nameHelp">
          <div id="nameHelp" class="form-text">Your first and last name.</div>
        </div>
        <div class="col-12 col-md-6">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" aria-describedby="emailHelp">
          <div id="emailHelp" class="form-text">We will never share your email.</div>
        </div>
        <div class="col-12">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here" aria-describedby="messageHelp"></textarea>
          <div id="messageHelp" class="form-text">Tell us how we can help (at least 10 characters).</div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Send</button>
        </div>
      </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
